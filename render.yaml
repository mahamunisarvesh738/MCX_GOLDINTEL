# Render Blueprint Specification for MCX Bullion Commodity Derivatives Intelligence
# Deploys Managed PostgreSQL Database + Full-Stack Node.js/React Web Service

services:
  - type: web
    name: mcx-bullion-intel
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install --legacy-peer-deps && npm run build && cd ..
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mcx-bullion-db
          property: connectionString

databases:
  - name: mcx-bullion-db
    plan: free
    databaseName: mcx_bullion
    user: mcx_user
